<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>₹ INR Live — Indian Rupee vs Major Currencies</title>
  <link rel="preconnect" href="https://open.er-api.com" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">₹</span>
      <div>
        <h1>INR Live</h1>
        <p>Indian Rupee vs the world — in real time</p>
      </div>
    </div>
    <div class="header-actions">
      <span id="status" class="status status--loading">
        <span class="dot"></span><span class="status-text">Connecting…</span>
      </span>
      <button id="refreshBtn" class="btn-refresh" title="Refresh now" aria-label="Refresh rates">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- Converter -->
    <section class="converter card">
      <div class="converter-row">
        <div class="conv-field">
          <label>Amount</label>
          <div class="conv-input">
            <span class="conv-flag">🇮🇳</span>
            <input id="baseAmount" type="number" inputmode="decimal" value="1" min="0" step="any" />
            <span class="conv-code">INR</span>
          </div>
        </div>

        <button id="swapBtn" class="swap-btn" title="Swap" aria-label="Swap currencies">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7 7h11l-3-3 1.4-1.4L21.8 8l-5.4 5.4L15 12l3-3H7V7Zm10 10H6l3 3-1.4 1.4L2.2 16l5.4-5.4L9 12l-3 3h11v2Z"/></svg>
        </button>

        <div class="conv-field">
          <label>Converted to</label>
          <div class="conv-input">
            <span id="targetFlag" class="conv-flag">🇺🇸</span>
            <input id="targetAmount" type="number" inputmode="decimal" value="0" min="0" step="any" />
            <select id="targetCurrency" class="conv-code-select"></select>
          </div>
        </div>
      </div>
      <p id="rateLine" class="rate-line">—</p>
    </section>

    <!-- Controls -->
    <div class="controls">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg>
        <input id="searchInput" type="text" placeholder="Search currency or country…" />
      </div>
      <div class="sort-wrap">
        <label for="sortSelect">Sort</label>
        <select id="sortSelect">
          <option value="popular">Popular</option>
          <option value="name">Name (A–Z)</option>
          <option value="high">Rate: high → low</option>
          <option value="low">Rate: low → high</option>
        </select>
      </div>
    </div>

    <!-- Cards grid -->
    <section id="grid" class="grid" aria-live="polite"></section>

    <p id="updated" class="updated">—</p>
  </main>

  <footer class="app-footer">
    <p>Rates by <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">exchangerate-api.com</a> · Auto-refreshes every 60s · For reference only</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
